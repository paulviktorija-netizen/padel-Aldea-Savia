<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Court — Aldea Savia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #2e7d4f; --green-light: #e8f5ee; --green-mid: #4caf78;
      --red: #c0392b; --red-light: #fdf0ee;
      --gray: #6b7280; --gray-light: #f3f4f6; --border: #d1d5db;
      --text: #111827; --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; color: var(--text); min-height: 100vh; }
    .lang-toggle { display: flex; align-items: center; gap: 6px; }
    .lang-btn { background: none; border: 2px solid transparent; border-radius: 6px; font-size: 20px; cursor: pointer; padding: 2px 4px; line-height: 1; transition: border-color .2s, opacity .2s; opacity: .45; }
    .lang-btn.active { border-color: rgba(255,255,255,.6); opacity: 1; }
    .lang-toggle.lock { position: absolute; top: 20px; right: 20px; }
    .lang-toggle.lock .lang-btn { opacity: .55; }
    .lang-toggle.lock .lang-btn.active { border-color: rgba(255,255,255,.7); opacity: 1; }
    #lock-screen { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; background: url('/court.png') center center / cover no-repeat; }
    #lock-screen::before { content: ''; position: absolute; inset: 0; background: rgba(0, 40, 80, 0.55); }
    #lock-screen .card { background: var(--white); border-radius: 16px; padding: 40px 36px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25); text-align: center; }
    #lock-screen .logo { margin-bottom: 28px; }
    #lock-screen .logo .logo-main { font-family: 'Cormorant Garamond', 'Garamond', 'Georgia', serif; font-size: 32px; font-weight: 300; letter-spacing: 6px; color: #2b2d3a; text-transform: uppercase; display: block; }
    #lock-screen .logo .logo-sub { font-family: 'Cormorant Garamond', 'Garamond', 'Georgia', serif; font-size: 13px; font-weight: 400; letter-spacing: 5px; color: #2b2d3a; text-transform: uppercase; display: block; margin-top: 4px; }
    #lock-screen h1 { font-size: 22px; font-weight: 700; color: var(--green); margin-bottom: 4px; }
    #lock-screen .subtitle { font-size: 13px; color: var(--gray); margin-bottom: 28px; }
    #lock-screen input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; letter-spacing: 3px; text-align: center; margin-bottom: 12px; outline: none; transition: border-color .2s; }
    #lock-screen input:focus { border-color: var(--green); }
    #lock-screen .error { color: var(--red); font-size: 13px; margin-bottom: 10px; min-height: 18px; }
    #lock-screen button.main-btn { width: 100%; padding: 13px; background: var(--green); color: var(--white); border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    #lock-screen button.main-btn:hover { background: #256942; }
    #lock-screen .hint { margin-top: 20px; font-size: 12px; color: var(--gray); }
    #app { display: none; }
    header { background: linear-gradient(135deg, #1a4731, #2e7d4f); color: var(--white); padding: 0 24px; }
    .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
    .header-left h1 { font-size: 20px; font-weight: 700; }
    .header-left p { font-size: 12px; opacity: .75; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .btn-logout { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: var(--white); padding: 7px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; }
    .btn-logout:hover { background: rgba(255,255,255,.25); }
    .tabs-bar { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .tabs-inner { max-width: 900px; margin: 0 auto; display: flex; }
    .tab-btn { padding: 14px 24px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 14px; font-weight: 600; color: var(--gray); cursor: pointer; }
    .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
    .main { max-width: 900px; margin: 0 auto; padding: 28px 24px; }
    .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; background: var(--white); border-radius: 12px; padding: 14px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .date-nav button { background: var(--gray-light); border: none; width: 36px; height: 36px; border-radius: 8px; font-size: 18px; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .date-nav button:disabled { opacity: .35; cursor: default; }
    .date-label { text-align: center; }
    .date-label .day-name { font-size: 13px; color: var(--gray); }
    .date-label .day-date { font-size: 18px; font-weight: 700; }
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .slot-card { background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 18px 20px; transition: all .2s; }
    .slot-card.available { cursor: pointer; border-color: var(--green-mid); }
    .slot-card.available:hover { background: var(--green-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(46,125,79,.15); }
    .slot-card.booked { background: #fef9f9; border-color: #f5c6c2; }
    .slot-time { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .slot-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .slot-status.free { background: var(--green-light); color: var(--green); }
    .slot-status.taken { background: #fde8e8; color: var(--red); }
    .slot-booker { margin-top: 8px; font-size: 12px; color: var(--gray); }
    .slot-booker strong { color: var(--text); }
    .my-res-lookup { background: var(--white); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .lookup-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    .lookup-row input { padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .lookup-row input:focus { border-color: var(--green); }
    .lookup-row button { padding: 10px 18px; background: var(--green); color: var(--white); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .res-list { display: flex; flex-direction: column; gap: 12px; }
    .res-item { background: var(--white); border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .res-item-info .res-date { font-size: 13px; color: var(--gray); margin-bottom: 2px; }
    .res-item-info .res-slot { font-size: 16px; font-weight: 700; }
    .res-item-info .res-companions { font-size: 12px; color: var(--gray); margin-top: 4px; }
    .btn-cancel { padding: 8px 16px; background: var(--white); color: var(--red); border: 2px solid var(--red); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background .2s; }
    .btn-cancel:hover { background: var(--red-light); }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--gray); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--white); border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 80px rgba(0,0,0,.25); }
    .modal h2 { font-size: 20px; margin-bottom: 6px; }
    .modal .modal-subtitle { font-size: 13px; color: var(--gray); margin-bottom: 24px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; resize: vertical; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--green); }
    .form-error { color: var(--red); font-size: 13px; margin-top: 16px; padding: 10px 14px; background: var(--red-light); border-radius: 8px; display: none; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn-primary { flex: 1; padding: 13px; background: var(--green); color: var(--white); border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #256942; }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .btn-secondary { flex: 1; padding: 13px; background: var(--gray-light); color: var(--text); border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-secondary:hover { background: var(--border); }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--white); padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 999; transition: transform .3s ease; white-space: nowrap; max-width: calc(100vw - 48px); text-align: center; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--green); }
    #toast.error { background: var(--red); }
    .info-box { background: var(--green-light); border: 1px solid #b2d8c3; border-radius: 10px; padding: 14px 16px; font-size: 13px; color: #1a4731; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px; }
    .info-box .icon { flex-shrink: 0; font-size: 16px; margin-top: 1px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .lookup-row { grid-template-columns: 1fr; }
      .res-item { flex-direction: column; align-items: flex-start; }
      .slots-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="lock-screen">
  <div class="lang-toggle lock">
    <button class="lang-btn active" id="lock-lang-en" onclick="setLang('en')" title="English">&#127468;&#127463;</button>
    <button class="lang-btn" id="lock-lang-es" onclick="setLang('es')" title="Espanol">&#127466;&#127480;</button>
  </div>
  <div class="card">
    <div class="logo">
      <span class="logo-main">Aldea Savia</span>
      <span class="logo-sub">Tulum</span>
    </div>
    <h1>&#127934; Padel Court</h1>
    <div class="subtitle">Phase 3 &middot; Residents only</div>
    <p id="lock-desc" style="font-size:13px;color:#6b7280;margin-bottom:20px;"></p>
    <input type="password" id="passcode-input" autocomplete="off" />
    <div class="error" id="lock-error"></div>
    <button class="main-btn" id="lock-btn" onclick="checkPasscode()"></button>
    <p class="hint" id="lock-hint"></p>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1>&#127934; Padel Court &mdash; Aldea Savia</h1>
        <p id="header-sub"></p>
      </div>
      <div class="header-right">
        <div class="lang-toggle">
          <button class="lang-btn active" id="app-lang-en" onclick="setLang('en')" title="English">&#127468;&#127463;</button>
          <button class="lang-btn" id="app-lang-es" onclick="setLang('es')" title="Espanol">&#127466;&#127480;</button>
        </div>
        <button class="btn-logout" id="btn-logout" onclick="logout()"></button>
      </div>
    </div>
  </header>
  <div class="tabs-bar">
    <div class="tabs-inner">
      <button class="tab-btn active" id="tab-book" onclick="switchTab('book')"></button>
      <button class="tab-btn" id="tab-my" onclick="switchTab('my')"></button>
    </div>
  </div>
  <div id="panel-book" class="main">
    <div class="info-box"><span class="icon">&#8505;&#65039;</span><span id="info-text"></span></div>
    <div class="date-nav">
      <button id="btn-prev" onclick="changeDay(-1)">&#8249;</button>
      <div class="date-label">
        <div class="day-name" id="day-name"></div>
        <div class="day-date" id="day-date"></div>
      </div>
      <button id="btn-next" onclick="changeDay(1)">&#8250;</button>
    </div>
    <div class="slots-grid" id="slots-grid"></div>
  </div>
  <div id="panel-my" class="main" style="display:none;">
    <div class="my-res-lookup">
      <h3 id="my-title" style="font-size:16px;margin-bottom:10px;"></h3>
      <p id="my-desc" style="font-size:13px;color:#6b7280;margin-bottom:14px;"></p>
      <div class="lookup-row">
        <input type="text" id="lookup-lastname" />
        <input type="text" id="lookup-unit" />
        <button id="btn-search" onclick="loadMyReservations()"></button>
      </div>
    </div>
    <div id="my-res-list"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div class="modal-subtitle" id="modal-subtitle"></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-firstname"></label><input type="text" id="f-firstname" /></div>
      <div class="form-group"><label id="lbl-lastname"></label><input type="text" id="f-lastname" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-unit"></label><input type="text" id="f-unit" placeholder="e.g. 342" /></div>
      <div class="form-group">
        <label id="lbl-phase"></label>
        <select id="f-phase">
          <option value="" id="phase-placeholder"></option>
          <option value="1">Phase 1</option>
          <option value="2">Phase 2</option>
          <option value="3">Phase 3</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label id="lbl-companions"></label>
      <textarea id="f-companions" rows="2"></textarea>
      <span id="companions-hint" style="font-size:11px;color:#9ca3af;margin-top:4px;"></span>
    </div>
    <div class="form-error" id="form-error"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-modal-cancel" onclick="closeModal()"></button>
      <button class="btn-primary" id="confirm-btn" onclick="confirmBooking()"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-overlay">
  <div class="modal">
    <h2 id="edit-title"></h2>
    <div class="modal-subtitle" id="edit-subtitle"></div>
    <p id="edit-verify-desc" style="font-size:14px;color:#6b7280;margin-bottom:16px;"></p>
    <div class="form-row">
      <div class="form-group"><label id="edit-lbl-lastname"></label><input type="text" id="e-lastname" /></div>
      <div class="form-group"><label id="edit-lbl-unit"></label><input type="text" id="e-unit" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label id="edit-lbl-firstname"></label><input type="text" id="e-firstname" /></div>
      <div class="form-group">
        <label id="edit-lbl-phase"></label>
        <select id="e-phase">
          <option value="1">Phase 1</option>
          <option value="2">Phase 2</option>
          <option value="3">Phase 3</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label id="edit-lbl-companions"></label>
      <textarea id="e-companions" rows="2"></textarea>
    </div>
    <div class="form-error" id="edit-error"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-edit-cancel" onclick="closeEditModal()"></button>
      <button class="btn-primary" id="edit-confirm-btn" onclick="confirmEdit()"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cancel-overlay">
  <div class="modal">
    <h2 id="cancel-title"></h2>
    <div class="modal-subtitle" id="cancel-subtitle"></div>
    <p id="cancel-desc" style="font-size:14px;color:#6b7280;margin-bottom:20px;"></p>
    <div class="form-row">
      <div class="form-group"><label id="lbl-c-lastname"></label><input type="text" id="c-lastname" /></div>
      <div class="form-group"><label id="lbl-c-unit"></label><input type="text" id="c-unit" /></div>
    </div>
    <div class="form-error" id="cancel-error"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancel-back" onclick="closeCancelModal()"></button>
      <button class="btn-primary" id="cancel-confirm-btn" style="background:var(--red);" onclick="confirmCancel()"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

let currentDate=new Date();currentDate.setHours(0,0,0,0);
let pendingSlot=null,pendingCancelId=null,pendingEditId=null;

async function checkPasscode(){
  const code=document.getElementById("passcode-input").value.trim();
  const btn=document.getElementById("lock-btn");
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    const res=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})});
    if(res.ok){sessionStorage.setItem("auth","1");document.getElementById("lock-screen").style.display="none";document.getElementById("app").style.display="block";renderSlots();}
    else{document.getElementById("lock-error").textContent=t("lockError");document.getElementById("passcode-input").value="";}
  }catch{document.getElementById("lock-error").textContent=t("lockNetError");}
  finally{btn.disabled=false;btn.textContent=t("lockBtn");}
}

function logout(){
  sessionStorage.removeItem("auth");
  document.getElementById("app").style.display="none";
  document.getElementById("lock-screen").style.display="flex";
  document.getElementById("passcode-input").value="";
  document.getElementById("lock-error").textContent="";
}

document.getElementById("passcode-input").addEventListener("keydown",e=>{if(e.key==="Enter")checkPasscode();});
if(sessionStorage.getItem("auth")==="1"){document.getElementById("lock-screen").style.display="none";document.getElementById("app").style.display="block";}

function toDateStr(d){return d.toISOString().slice(0,10);}
function formatDateDisplay(dateStr){
  const d=new Date(dateStr+"T12:00:00");
  return T[lang].dayNamesShort[d.getDay()]+" "+d.getDate()+" "+T[lang].monthNamesShort[d.getMonth()]+" "+d.getFullYear();
}
const TULUM_OFFSET_MS=5*60*60*1000;
function slotStartMs(dateStr,slotLabel){
  const hhmm=slotLabel.split("-")[0].trim();
  const [hh,mm]=hhmm.split(":").map(Number);
  const [yyyy,mo,dd]=dateStr.split("-").map(Number);
  return Date.UTC(yyyy,mo-1,dd,hh,mm,0)+TULUM_OFFSET_MS;
}
function isSlotInPast(dateStr,slotLabel){return slotStartMs(dateStr,slotLabel)<Date.now();}
function isWithin24h(dateStr,slotLabel){const diff=(slotStartMs(dateStr,slotLabel)-Date.now())/3600000;return diff>=0&&diff<=24;}

function switchTab(tab){
  document.getElementById("panel-book").style.display=tab==="book"?"block":"none";
  document.getElementById("panel-my").style.display=tab==="my"?"block":"none";
  document.getElementById("tab-book").classList.toggle("active",tab==="book");
  document.getElementById("tab-my").classList.toggle("active",tab==="my");
  if(tab==="book")renderSlots();
}

function changeDay(delta){
  const next=new Date(currentDate);next.setDate(next.getDate()+delta);
  const today=new Date();today.setHours(0,0,0,0);
  const maxDay=new Date(today);maxDay.setDate(today.getDate()+1);
  if(next<today||next>maxDay)return;
  currentDate=next;renderSlots();
}

const SLOTS=["09:00 - 10:30","10:30 - 12:00","12:00 - 13:30","16:00 - 17:30","17:30 - 19:00","19:00 - 20:30","20:30 - 22:00"];

async function renderSlots(){
  const today=new Date();today.setHours(0,0,0,0);
  const maxDay=new Date(today);maxDay.setDate(today.getDate()+1);
  document.getElementById("btn-prev").disabled=(currentDate<=today);
  document.getElementById("btn-next").disabled=(currentDate>=maxDay);
  const dateStr=toDateStr(currentDate);
  const isToday=currentDate.getTime()===today.getTime();
  document.getElementById("day-name").textContent=isToday?t("today")+" - "+T[lang].dayNames[currentDate.getDay()]:T[lang].dayNames[currentDate.getDay()];
  document.getElementById("day-date").textContent=currentDate.getDate()+" "+T[lang].monthNames[currentDate.getMonth()]+" "+currentDate.getFullYear();
  const grid=document.getElementById("slots-grid");
  grid.innerHTML='<div class="empty-state"><div class="icon">&#9203;</div>'+t("loading")+'</div>';
  let reservations=[];
  try{const res=await fetch("/api/reservations?date="+dateStr);reservations=await res.json();}
  catch{grid.innerHTML='<div class="empty-state"><div class="icon">&#9888;&#65039;</div>'+t("loadError")+'</div>';return;}
  grid.innerHTML="";
  SLOTS.forEach(slot=>{
    const booking=reservations.find(r=>r.slot===slot);
    const inPast=isSlotInPast(dateStr,slot);
    const canBook=!inPast&&isWithin24h(dateStr,slot);
    const card=document.createElement("div");
    card.className="slot-card "+(booking?"booked":(canBook?"available":""));
    let statusHtml,extraHtml="";
    if(booking){
      statusHtml='<span class="slot-status taken">&#9679; '+t("statusBooked")+'</span>';
      extraHtml='<div class="slot-booker"><strong>'+booking.firstName+" "+booking.lastName+"</strong> &middot; Unit "+booking.unit+" (Phase "+booking.phase+")<br>"+t("with")+" "+booking.companions+"</div>";
    }else if(inPast){
      statusHtml='<span class="slot-status" style="background:#f3f4f6;color:#9ca3af;">&#9679; '+t("statusPast")+'</span>';
    }else if(!canBook){
      statusHtml='<span class="slot-status" style="background:#f3f4f6;color:#9ca3af;">&#9679; '+t("statusNotOpen")+'</span>';
    }else{
      statusHtml='<span class="slot-status free">&#9679; '+t("statusFree")+'</span>';
    }
    card.innerHTML='<div class="slot-time">'+slot+"</div>"+statusHtml+extraHtml;
    if(!booking&&canBook)card.addEventListener("click",()=>openBookingModal(dateStr,slot));
    grid.appendChild(card);
  });
}

function openBookingModal(dateStr,slot){
  pendingSlot={date:dateStr,slot};
  document.getElementById("modal-subtitle").textContent=formatDateDisplay(dateStr)+" - "+slot;
  ["f-firstname","f-lastname","f-unit","f-companions"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f-phase").value="";
  document.getElementById("form-error").style.display="none";
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal(){document.getElementById("modal-overlay").classList.remove("open");pendingSlot=null;}

async function confirmBooking(){
  const firstName=document.getElementById("f-firstname").value.trim();
  const lastName=document.getElementById("f-lastname").value.trim();
  const unit=document.getElementById("f-unit").value.trim();
  const phase=document.getElementById("f-phase").value;
  const companions=document.getElementById("f-companions").value.trim();
  const errEl=document.getElementById("form-error");
  if(!firstName||!lastName||!unit||!phase||!companions){errEl.textContent=t("allRequired");errEl.style.display="block";return;}
  const btn=document.getElementById("confirm-btn");
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> '+t("confirmBtn");
  try{
    const res=await fetch("/api/reservations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:pendingSlot.date,slot:pendingSlot.slot,firstName,lastName,unit,phase,companions})});
    const data=await res.json();
    if(!res.ok){errEl.textContent=data.error;errEl.style.display="block";return;}
    closeModal();await renderSlots();showToast(t("bookingOk"),"success");
  }catch{errEl.textContent=t("netError");errEl.style.display="block";}
  finally{btn.disabled=false;btn.textContent=t("confirmBtn");}
}

async function loadMyReservations(){
  const lastName=document.getElementById("lookup-lastname").value.trim();
  const unit=document.getElementById("lookup-unit").value.trim();
  const container=document.getElementById("my-res-list");
  if(!lastName||!unit){container.innerHTML='<div class="empty-state"><div class="icon">&#9888;&#65039;</div>'+t("lookupWarn")+'</div>';return;}
  container.innerHTML='<div class="empty-state"><div class="icon">&#9203;</div>'+t("loading")+'</div>';
  const res=await fetch("/api/my-reservations?lastName="+encodeURIComponent(lastName)+"&unit="+encodeURIComponent(unit));
  const reservations=await res.json();
  if(!Array.isArray(reservations)||reservations.length===0){container.innerHTML='<div class="empty-state"><div class="icon">&#128205;</div>'+t("noRes",lastName,unit)+'</div>';return;}
  const upcoming=reservations.filter(r=>!isSlotInPast(r.date,r.slot));
  const past=reservations.filter(r=>isSlotInPast(r.date,r.slot));
  let html="";
  if(upcoming.length>0){
    html+='<h3 style="font-size:14px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;">'+t("upcoming")+'</h3><div class="res-list">'+upcoming.map(r=>'<div class="res-item"><div class="res-item-info"><div class="res-date">'+formatDateDisplay(r.date)+'</div><div class="res-slot">'+r.slot+'</div><div class="res-companions">'+t("with")+" "+r.companions+'</div></div><div style="display:flex;gap:8px;flex-shrink:0;"><button class="btn-cancel" style="border-color:var(--green);color:var(--green);" onclick="openEditModal(\''+r.id+'\',\''+r.date+'\',\''+r.slot+'\',\''+encodeURIComponent(r.firstName)+'\',\''+encodeURIComponent(r.phase)+'\',\''+encodeURIComponent(r.companions)+'\')">'+t("editBtn")+'</button><button class="btn-cancel" onclick="openCancelModal(\''+r.id+'\',\''+r.date+'\',\''+r.slot+'\')">'+t("cancel")+'</button></div></div>').join("")+"</div>";
  }
  if(past.length>0){
    html+='<h3 style="font-size:14px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin:24px 0 12px;">'+t("past")+'</h3><div class="res-list">'+past.map(r=>'<div class="res-item" style="opacity:.55;"><div class="res-item-info"><div class="res-date">'+formatDateDisplay(r.date)+'</div><div class="res-slot">'+r.slot+'</div><div class="res-companions">'+t("with")+" "+r.companions+'</div></div><span style="font-size:12px;color:#9ca3af;">'+t("past")+'</span></div>').join("")+"</div>";
  }
  container.innerHTML=html;
}

let toastTimer;
function showToast(msg,type=""){
  const el=document.getElementById("toast");el.textContent=msg;el.className="show "+type;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className="";},3200);
}
